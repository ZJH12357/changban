  <g class="foot-right"><ellipse cx="200" cy="313" rx="29" ry="13" fill="#c6ac8b"/><ellipse cx="200" cy="309" rx="28" ry="14" fill="url(#cream)"/><path d="M200 312v5m10-5v5" stroke="#d1bda3" stroke-width="2.4" stroke-linecap="round"/></g>
