<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" data-state="idle" role="img" aria-labelledby="title desc">
 <title id="title">豆豆，一只棕白垂耳小狗</title><desc id="desc">戴绿色小领巾的小狗，支持摇尾、走路、歪头嗅闻、打盹、抬爪打招呼、开心和温柔提醒。</desc>
 <defs>
  <linearGradient id="brown" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5af83"/><stop offset=".55" stop-color="#bd8e60"/><stop offset="1" stop-color="#a9754a"/></linearGradient>
  <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b78659"/><stop offset="1" stop-color="#865a3b"/></linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#eee0c9"/></linearGradient>
  <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#83a08d"/><stop offset="1" stop-color="#497b6b"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#fffdf2" stop-opacity=".6"/><stop offset="1" stop-color="#fffdf2" stop-opacity="0"/></radialGradient>
 </defs>
 <style>
  *{transform-box:fill-box;transform-origin:center}svg{overflow:visible}.dog{transform-origin:50% 92%;animation:breathe 3.4s ease-in-out infinite}.tail{transform-origin:5% 90%;animation:wag 1.8s ease-in-out infinite}.ear-left{transform-origin:65% 9%;animation:ear-sway 4s ease-in-out infinite}.ear-right{transform-origin:35% 9%;animation:ear-sway 4s -.7s ease-in-out infinite}.head{transform-origin:50% 87%}.eyes{animation:blink 5.8s infinite}.closed-eyes,.sleep-marks,.hearts,.alert-mark,.paw-pad,.tongue{opacity:0}.paw-left,.paw-right{transform-origin:50% 12%}.bandana-tip{transform-origin:50% 0;animation:scarf 3.4s ease-in-out infinite}
  [data-state=walk] .dog{animation:walk-body .6s ease-in-out infinite}[data-state=walk] .paw-left,[data-state=walk] .foot-right{animation:step .6s infinite}[data-state=walk] .paw-right,[data-state=walk] .foot-left{animation:step .6s -.3s infinite}[data-state=walk] .tail{animation:wag .7s ease-in-out infinite}[data-state=walk] .ear-left,[data-state=walk] .ear-right{animation:ear-sway .6s ease-in-out infinite}
  [data-state=look] .head{animation:sniff 4.4s ease-in-out infinite}[data-state=look] .nose{animation:nose .5s ease-in-out infinite}[data-state=look] .ear-right{animation:ear-sway 2s ease-in-out infinite}
  [data-state=stretch] .dog{animation:stretch 3.5s ease-in-out infinite}[data-state=stretch] .head{animation:stretch-head 3.5s ease-in-out infinite}
  [data-state=sleep] .dog{transform:translateY(15px) scaleY(.91);animation:sleep-breathe 5s ease-in-out infinite}[data-state=sleep] .head{transform:translate(-5px,12px) rotate(-12deg)}[data-state=sleep] .eyes{opacity:0;animation:none}[data-state=sleep] .closed-eyes{opacity:1}[data-state=sleep] .tail{animation:wag 7s ease-in-out infinite}[data-state=sleep] .sleep-marks{opacity:1;animation:float 3s ease-in-out infinite}
  [data-state=greet] .paw-right{animation:wave 1s ease-in-out infinite}[data-state=greet] .paw-pad{opacity:1}[data-state=greet] .head{transform:rotate(-7deg)}[data-state=greet] .tail{animation:wag .55s ease-in-out infinite}[data-state=greet] .tongue{opacity:1}
  [data-state=happy] .dog{animation:hop .85s ease-in-out infinite}[data-state=happy] .tail{animation:wag .35s ease-in-out infinite}[data-state=happy] .eyes{opacity:0;animation:none}[data-state=happy] .closed-eyes,[data-state=happy] .tongue{opacity:1}[data-state=happy] .hearts{opacity:1;animation:float 1.6s ease-in-out infinite}[data-state=happy] .ear-left,[data-state=happy] .ear-right{animation:ear-sway .85s infinite}
  [data-state=alert] .alert-mark{opacity:1;animation:float 2s ease-in-out infinite}[data-state=alert] .head{animation:nod 2.5s ease-in-out infinite}[data-state=alert] .paw-right{animation:tap 1.4s infinite}
  [data-paused=true] *{animation-play-state:paused!important}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012,.985)}}
  @keyframes wag{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(18deg)}}
  @keyframes ear-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}
  @keyframes blink{0%,46%,50%,91%,95%,100%{transform:scaleY(1)}48%,93%{transform:scaleY(.07)}}
  @keyframes scarf{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
  @keyframes walk-body{0%,50%,100%{transform:translateY(0) rotate(-1.5deg)}25%,75%{transform:translateY(-6px) rotate(1.5deg)}}
  @keyframes step{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-13px) rotate(8deg)}}
  @keyframes sniff{0%,10%,100%{transform:rotate(0)}28%,40%{transform:rotate(-13deg)}62%,78%{transform:translateY(7px) rotate(10deg)}}
  @keyframes nose{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
  @keyframes stretch{0%,100%{transform:scale(1)}40%,65%{transform:translateY(7px) scale(1.1,.94)}}
  @keyframes stretch-head{0%,100%{transform:translateY(0)}40%,65%{transform:translateY(17px) rotate(7deg)}}
  @keyframes sleep-breathe{0%,100%{transform:translateY(15px) scale(1,.91)}50%{transform:translateY(14px) scale(1.012,.925)}}
  @keyframes wave{0%,100%{transform:translate(5px,-20px) rotate(-91deg)}50%{transform:translate(5px,-23px) rotate(-120deg)}}
  @keyframes hop{0%,65%,100%{transform:translateY(0)}30%{transform:translateY(-18px) rotate(3deg)}48%{transform:translateY(-4px) rotate(-2deg)}}
  @keyframes float{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(-8px);opacity:1}}
  @keyframes nod{0%,65%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}45%{transform:rotate(4deg)}}
  @keyframes tap{0%,65%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
