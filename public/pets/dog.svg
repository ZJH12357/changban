  <g class="paw-right"><path d="M209 220C226 222 229 258 222 277C217 291 199 288 196 273L191 234Z" fill="url(#brown)"/><ellipse cx="210" cy="275" rx="14" ry="14" fill="url(#cream)"/><g class="paw-pad" fill="#d09e91"><ellipse cx="210" cy="276" rx="6" ry="5"/><circle cx="204" cy="267" r="2.8"/><circle cx="212" cy="265" r="2.8"/><circle cx="218" cy="270" r="2.8"/></g></g>
  <g class="head">
   <g class="ear-left"><path d="M102 78C76 62 56 85 49 118C40 154 47 201 66 204C88 208 99 173 102 145Z" fill="url(#ear)"/><path d="M64 112q-16 48-1 72" fill="none" stroke="#d7b18a" stroke-width="8" stroke-linecap="round" opacity=".35"/></g>
   <g class="ear-right"><path d="M218 78C244 62 264 85 271 118C280 154 273 201 254 204C232 208 221 173 218 145Z" fill="url(#ear)"/><path d="M256 112q16 48 1 72" fill="none" stroke="#d7b18a" stroke-width="8" stroke-linecap="round" opacity=".35"/></g>
   <path d="M160 63C106 61 72 93 72 144C68 196 101 226 160 227C219 226 252 196 248 144C248 93 214 61 160 63Z" fill="url(#cream)"/>
   <path d="M147 64C109 64 81 88 76 120C73 148 82 173 104 179C133 189 147 169 147 146C144 115 138 92 147 64Z" fill="url(#brown)"/>
   <path d="M174 64C203 67 232 83 242 111C228 112 206 106 194 96Z" fill="#d3ad84" opacity=".8"/>
   <ellipse cx="139" cy="102" rx="69" ry="39" fill="url(#light)"/>
   <g class="eyes"><ellipse cx="119" cy="143" rx="13" ry="17" fill="#514d40"/><ellipse cx="202" cy="143" rx="13" ry="17" fill="#514d40"/><ellipse cx="119" cy="145" rx="8" ry="12" fill="#343a32"/><ellipse cx="202" cy="145" rx="8" ry="12" fill="#343a32"/><circle cx="115" cy="137" r="4.5" fill="#fffef4"/><circle cx="198" cy="137" r="4.5" fill="#fffef4"/><circle cx="124" cy="150" r="2" fill="#c4d1b6"/><circle cx="207" cy="150" r="2" fill="#c4d1b6"/></g>
   <g class="closed-eyes" fill="none" stroke="#655e4d" stroke-width="5" stroke-linecap="round"><path d="M106 145q12-12 25 0m58 0q12-12 25 0"/></g>
   <ellipse cx="101" cy="173" rx="13" ry="7" fill="#d69c87" opacity=".45"/><ellipse cx="220" cy="173" rx="13" ry="7" fill="#d69c87" opacity=".45"/>
   <path d="M161 161C148 154 125 164 126 181C126 197 142 204 160 198C178 204 195 197 195 181C195 164 173 154 161 161Z" fill="#fffbef"/>
   <path class="tongue" d="M149 193C148 218 172 218 172 193Z" fill="#d79b92"/><path class="tongue" d="M160 197v11" stroke="#bf7d76" stroke-width="2" stroke-linecap="round"/>
   <path class="nose" d="M148 166Q160 160 173 166Q174 175 161 181Q147 175 148 166" fill="#71604d"/><ellipse cx="156" cy="166" rx="5" ry="2" fill="#a6937a" opacity=".7"/>
   <path d="M161 181v5m0 0q-8 11-17 3m17-3q8 11 17 3" fill="none" stroke="#8e7962" stroke-width="2.8" stroke-linecap="round"/>
   <g fill="#a9957c" opacity=".55"><circle cx="138" cy="178" r="1.5"/><circle cx="142" cy="184" r="1.4"/><circle cx="183" cy="178" r="1.5"/><circle cx="179" cy="184" r="1.4"/></g>
   <path d="M147 64q5-14 14-9q-4 2-4 7q12-9 19 0" fill="none" stroke="#ecddc4" stroke-width="7" stroke-linecap="round"/>
  </g>
  <path d="M117 218Q160 232 205 216L208 230Q162 248 115 231Z" fill="url(#scarf)"/>
