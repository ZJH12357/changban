<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" data-state="idle" role="img" aria-labelledby="title desc">
 <title id="title">慢慢，一只奶油橘白小猫</title>
 <desc id="desc">戴绿色领巾的小猫。支持待机、踏步、张望、伸懒腰、打盹、招手、开心和提醒八种动作。</desc>
 <defs>
  <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7dbb0"/><stop offset=".52" stop-color="#edc691"/><stop offset="1" stop-color="#dca96e"/></linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf2"/><stop offset="1" stop-color="#f5ead6"/></linearGradient>
  <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e5b7a3"/><stop offset="1" stop-color="#f3d0b9"/></linearGradient>
  <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7ca28b"/><stop offset="1" stop-color="#4b806d"/></linearGradient>
  <radialGradient id="shine"><stop stop-color="#fffdf4" stop-opacity=".8"/><stop offset="1" stop-color="#fffdf4" stop-opacity="0"/></radialGradient>
 </defs>
 <style>
  *{transform-box:fill-box;transform-origin:center}svg{overflow:visible}.cat-shadow{transform-origin:center;animation:shadow 4s ease-in-out infinite}.cat{transform-origin:50% 91%;animation:breathe 4s ease-in-out infinite}.tail{transform-origin:13% 85%;animation:tail 4.8s ease-in-out infinite}.ear-left{transform-origin:65% 90%;animation:ear 7s ease-in-out infinite}.ear-right{transform-origin:35% 90%;animation:ear 8.5s 1s ease-in-out infinite}.head{transform-origin:50% 82%}.eyes{animation:blink 5.6s infinite}.closed-eyes,.sleep-marks,.hearts,.alert-mark,.paw-pad{opacity:0}.paw-left,.paw-right{transform-origin:50% 12%}.scarf-tip{transform-origin:40% 0;animation:scarf 4s ease-in-out infinite}.nose{transform-origin:center}
  [data-state=walk] .cat{animation:walk-body .7s ease-in-out infinite}[data-state=walk] .paw-left,[data-state=walk] .foot-right{animation:step .7s ease-in-out infinite}[data-state=walk] .paw-right,[data-state=walk] .foot-left{animation:step .7s -.35s ease-in-out infinite}[data-state=walk] .tail{animation:tail 1.4s ease-in-out infinite}[data-state=walk] .scarf-tip{animation:scarf .7s ease-in-out infinite}
  [data-state=look] .head{animation:look 4.6s ease-in-out infinite}[data-state=look] .pupils{animation:eyes-look 4.6s ease-in-out infinite}
  [data-state=stretch] .cat{animation:stretch-cat 4s ease-in-out infinite}[data-state=stretch] .torso{animation:stretch-body 4s ease-in-out infinite}[data-state=stretch] .head{animation:stretch-head 4s ease-in-out infinite}[data-state=stretch] .paw-left{animation:stretch-paw 4s ease-in-out infinite}[data-state=stretch] .paw-right{animation:stretch-paw 4s -.12s ease-in-out infinite}[data-state=stretch] .eyes{opacity:0;animation:none}[data-state=stretch] .closed-eyes{opacity:1}
  [data-state=sleep] .cat{animation:sleep-breathe 5s ease-in-out infinite;transform:translateY(15px) scaleY(.9)}[data-state=sleep] .head{transform:translate(4px,16px) rotate(12deg)}[data-state=sleep] .eyes{opacity:0;animation:none}[data-state=sleep] .closed-eyes{opacity:1}[data-state=sleep] .tail{animation:tail 8s ease-in-out infinite}[data-state=sleep] .sleep-marks{animation:float 3s ease-in-out infinite;opacity:1}
  [data-state=greet] .paw-right{animation:wave 1.1s ease-in-out infinite}[data-state=greet] .paw-right .paw-pad{opacity:1}[data-state=greet] .head{transform:rotate(-7deg)}[data-state=greet] .tail{animation:tail 2s ease-in-out infinite}
  [data-state=happy] .cat{animation:hop 1s ease-in-out infinite}[data-state=happy] .eyes{opacity:0;animation:none}[data-state=happy] .closed-eyes{opacity:1}[data-state=happy] .hearts{opacity:1;animation:float 2s ease-in-out infinite}[data-state=happy] .tail{animation:tail .9s ease-in-out infinite}[data-state=happy] .cat-shadow{animation:hop-shadow 1s ease-in-out infinite}
  [data-state=alert] .alert-mark{opacity:1;animation:float 2s ease-in-out infinite}[data-state=alert] .head{animation:nod 2.8s ease-in-out infinite}[data-state=alert] .ear-left{transform:rotate(-7deg);animation:none}[data-state=alert] .ear-right{transform:rotate(7deg);animation:none}[data-state=alert] .paw-right{animation:tap 1.5s ease-in-out infinite}
  [data-paused=true] *,[data-paused=true] .cat{animation-play-state:paused!important}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012,.987)}}
  @keyframes shadow{0%,100%{opacity:.7;transform:scaleX(1)}50%{opacity:.55;transform:scaleX(.96)}}
  @keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(12deg)}}
  @keyframes scarf{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(7deg)}}
  @keyframes blink{0%,42%,46%,91%,95%,100%{transform:scaleY(1)}44%,93%{transform:scaleY(.06)}}
  @keyframes ear{0%,65%,78%,100%{transform:rotate(0)}69%{transform:rotate(-9deg)}73%{transform:rotate(5deg)}}
  @keyframes walk-body{0%,50%,100%{transform:translateY(0) rotate(-1deg)}25%,75%{transform:translateY(-5px) rotate(1deg)}}
  @keyframes step{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-13px) rotate(7deg)}}
  @keyframes look{0%,10%,100%{transform:rotate(0)}30%,44%{transform:rotate(-10deg)}68%,82%{transform:rotate(9deg)}}
  @keyframes eyes-look{0%,10%,100%{transform:translateX(0)}30%,44%{transform:translateX(-4px)}68%,82%{transform:translateX(4px)}}
  @keyframes stretch-cat{0%,100%{transform:translateY(0)}40%,65%{transform:translateY(8px)}}
  @keyframes stretch-body{0%,100%{transform:scale(1)}40%,65%{transform:translateY(-8px) scale(1.18,.83)}}
  @keyframes stretch-head{0%,100%{transform:translateY(0)}40%,65%{transform:translateY(21px) rotate(-6deg)}}
  @keyframes stretch-paw{0%,100%{transform:translateY(0)}40%,65%{transform:translateY(12px) scaleY(1.13)}}
  @keyframes sleep-breathe{0%,100%{transform:translateY(15px) scale(1,.9)}50%{transform:translateY(14px) scale(1.014,.913)}}
  @keyframes wave{0%,100%{transform:translate(7px,-21px) rotate(-93deg)}50%{transform:translate(8px,-24px) rotate(-122deg)}}
  @keyframes hop{0%,65%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-3deg)}46%{transform:translateY(-5px) rotate(3deg)}}
  @keyframes hop-shadow{0%,65%,100%{transform:scaleX(1);opacity:.7}30%{transform:scaleX(.75);opacity:.3}}
  @keyframes float{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(-9px);opacity:1}}
  @keyframes nod{0%,65%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}45%{transform:rotate(3deg)}}
  @keyframes tap{0%,65%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
